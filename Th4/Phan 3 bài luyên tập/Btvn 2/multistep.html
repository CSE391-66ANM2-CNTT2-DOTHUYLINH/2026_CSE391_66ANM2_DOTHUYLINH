<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Multi Step Form</title>

<style>

body{
font-family:Arial;
padding:30px;
}

.step{
display:none;
}

.step.active{
display:block;
}

.progress{
height:10px;
background:#ddd;
margin-bottom:20px;
}

.progress-bar{
height:10px;
width:33%;
background:green;
}

input,select{
display:block;
margin-top:5px;
margin-bottom:10px;
padding:8px;
width:300px;
}

button{
padding:8px 15px;
margin-top:10px;
}

</style>

</head>

<body>

<h2>Form đăng ký</h2>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<form id="form">

<!-- STEP 1 -->
<div class="step active" id="step1">

<h3>Thông tin cá nhân</h3>

<label>Họ tên</label>
<input id="name">

<label>Ngày sinh</label>
<input type="date" id="birth">

<label>Giới tính</label>
<select id="gender">
<option value="">-- Chọn --</option>
<option>Nam</option>
<option>Nữ</option>
</select>

<button type="button" onclick="nextStep()">Tiếp theo</button>

</div>


<!-- STEP 2 -->
<div class="step" id="step2">

<h3>Thông tin tài khoản</h3>

<label>Email</label>
<input id="email">

<label>Mật khẩu</label>
<input type="password" id="password">

<label>Xác nhận mật khẩu</label>
<input type="password" id="confirmPassword">

<button type="button" onclick="prevStep()">Quay lại</button>
<button type="button" onclick="nextStep()">Tiếp theo</button>

</div>


<!-- STEP 3 -->
<div class="step" id="step3">

<h3>Xác nhận</h3>

<div id="summary"></div>

<button type="button" onclick="prevStep()">Quay lại</button>
<button type="submit">Đăng ký</button>

</div>

</form>

<script src="script.js"></script>

</body>
</html>
